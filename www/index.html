<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d1a" />
  <title>Thiên Tháp Dị Điểm</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d1a; color: #e8ebff; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #wrap { position: relative; aspect-ratio: 9 / 16; height: min(100vh, calc(100vw * 16 / 9)); max-width: 100vw; }
    canvas { width: 100%; height: 100%; display: block; background: #12152b; touch-action: none; }
    .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(8, 9, 22, 0.88); text-align: center; padding: 24px; }
    .overlay.show { display: flex; }
    h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: 0.5px; }
    p.sub { margin: 0 0 12px; opacity: 0.6; font-size: 14px; }
    button, input, select { font: inherit; border-radius: 12px; border: 1px solid #3a3f78; background: #1b1f45; color: #e8ebff; padding: 12px 18px; min-height: 44px; }
    button.primary { background: #4a5bff; border-color: #6b79ff; font-weight: 600; min-width: 200px; }
    #screen { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; gap: 10px; padding: 18px 16px; }
    #screen.show { display: flex; }
    #screen > * { max-width: 100%; box-sizing: border-box; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
    .card { background: #151937; border: 1px solid #3a3f78; border-radius: 14px; padding: 12px; width: 100%; text-align: left; }
    .card.btn { cursor: pointer; }
    .card.locked { opacity: 0.45; }
    .card h3 { margin: 0 0 4px; font-size: 16px; }
    .card small, .muted { opacity: 0.65; font-size: 12px; }
    .res { background: #151937; border-radius: 10px; padding: 6px 10px; font-size: 13px; }
    .hpbar { width: 100%; height: 14px; background: rgba(255,255,255,.12); border-radius: 7px; overflow: hidden; }
    .hpbar > i { display: block; height: 100%; background: #4cc46a; }
    .notice { background: #3a2a10; border: 1px solid #a8741a; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
    details { width: 100%; font-size: 13px; }
    textarea { width: 100%; min-height: 60px; background: #1b1f45; color: #e8ebff; border: 1px solid #3a3f78; border-radius: 10px; font-size: 11px; }
    .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; color: #0b0d1a; font-weight: 700; }
    label { font-size: 13px; opacity: 0.8; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="wrap">
      <canvas id="cv" width="540" height="960"></canvas>
      <div id="screen" class="overlay show"></div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
